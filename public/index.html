<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080d0b">
    <title>Kyle's Secret Chatroom</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main id="login-screen" class="login-screen">
      <section class="login-card" aria-labelledby="login-title">
        <a class="brand brand-login" href="/" aria-label="Kyle's Secret Chatroom home">
          <span class="brand-mark" aria-hidden="true">K<span>_</span></span>
          <span>KYLE<span class="brand-dot">.SECRET</span></span>
        </a>
        <p class="eyebrow">PRIVATE CHANNEL / ACCESS CONTROL</p>
        <h1 id="login-title">Enter the hidden room.</h1>
        <p class="login-copy">Only trusted members can open the secure channel.</p>
        <form id="login-form">
          <label for="username">USER ID</label>
          <select id="username" name="username" required>
            <option value="" selected disabled>Select your account</option>
            <option value="kyle_guest">Kyle's Guest</option>
            <option value="leo">Leo</option>
            <option value="geeker">Geeker</option>
            <option value="fofo">Fofo</option>
            <option value="kyle">Kyle · Owner</option>
          </select>
          <label for="password">PASSPHRASE</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <p id="login-error" class="form-error" role="alert" hidden></p>
          <button class="button button-primary login-button" type="submit">
            Connect <span aria-hidden="true">↗</span>
          </button>
        </form>
        <p class="login-foot"><span class="status-light"></span> SECURE SESSION · INVITE ONLY</p>
      </section>
      <div class="login-orbit orbit-one" aria-hidden="true"></div>
      <div class="login-orbit orbit-two" aria-hidden="true"></div>
      <p class="login-coordinate" aria-hidden="true">KS-04 · 41°24'12.2"N</p>
    </main>
  </body>
</html>
